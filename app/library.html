<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- script-src: 'self' plus the hash of the one inline script below (the base corrector).
       connect-src stays open to http(s) for the user-configured translator server, and to a
       library on this computer (ws://127.0.0.1). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-hY3v5/hK8HEXGvbWdwpC9QwryUrAFnXUNYc6GOBIxBU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob: http: https: ws://127.0.0.1:*; object-src 'none'; base-uri 'self'">
  <!-- The app's files live under /app/ but the pages are served at clean URLs (/, /settings,
       /reader). This base (relative, so it works under both localhost / and Pages /shiori/)
       points asset references back at the app folder; in-page nav links use ../ to stay clean.
       The inline corrector handles a direct app/<page>.html load (no service worker): there the
       page's own directory already is the app folder, so the base must be ./ or every asset
       would resolve under app/app/. Inline by necessity — an external script's own URL would
       need the very base it computes; the CSP allows exactly this script by hash. -->
  <base href="app/">
  <script>if (/\/app\/[^/]*$/.test(location.pathname)) document.querySelector('base').href = './';</script>
  <link rel="icon" href="../icons/icon32.png">
  <title>Shiori — Library</title>
  <script src="font-init.js"></script>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="dropdown.css">
  <link rel="stylesheet" href="library.css">
  <link rel="stylesheet" href="notice.css">
  <!-- Preload the whole module graph in one parallel wave instead of a 4-level import waterfall. -->
  <link rel="modulepreload" href="js/library.js">
  <link rel="modulepreload" href="js/boot.js">
  <link rel="modulepreload" href="js/i18n.js">
  <link rel="modulepreload" href="js/locales.js">
  <link rel="modulepreload" href="js/tooltip.js">
  <link rel="modulepreload" href="js/dropdown.js">
  <link rel="modulepreload" href="js/platform.js">
  <link rel="modulepreload" href="js/services.js">
  <link rel="modulepreload" href="js/db.js">
  <link rel="modulepreload" href="js/image-util.js">
  <link rel="modulepreload" href="js/sanitize.js">
  <link rel="modulepreload" href="js/sites.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/backup.js">
  <link rel="modulepreload" href="js/translate.js">
  <link rel="modulepreload" href="js/ext-bridge.js">
  <link rel="modulepreload" href="js/submit-job.js">
  <link rel="modulepreload" href="js/jobs-runner.js">
  <link rel="modulepreload" href="js/import-cbz.js">
  <link rel="modulepreload" href="js/tag-editor.js">
  <link rel="modulepreload" href="js/search-field.js">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111111">
  <meta name="shiori-app" content="library">  <!-- lets the extension's bridge recognise the app -->

</head>
<body>

<header>
  <div class="header-left">
    <a class="brand-wrap" href="../">
      <div class="brand-icon"><img src="../icons/shiori-logo.svg" alt=""></div>
      <span class="brand-text">Shiori</span>
    </a>
    <span class="brand-sep">/</span>
    <span class="brand-page" data-i18n="nav.library">Library</span>
    <div class="search-wrap">
      <div class="header-search" id="searchBox" contenteditable="plaintext-only" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-autocomplete="list" spellcheck="false" data-placeholder="Search by ID, title or tags…" data-i18n-ph="lib.search_ph" aria-label="Search by ID, title or tags…" data-i18n-aria="lib.search_ph"></div>
      <button class="search-clear" id="searchClear" data-tip="Clear search" data-i18n-tip="lib.clear_search"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <button class="btn-pin" id="pinBtn" data-tip="Unpin header"></button>
  </div>
  <div class="header-right">
    <button class="burger-btn" id="burgerBtn" data-tip="Menu" data-i18n-tip="nav.menu">☰</button>
    <div class="collapsible-group" id="collapsibleGroup">
      <div class="hstat">
        <div class="hstat-val" id="hTotalGalleries">—</div>
        <div class="hstat-label" data-i18n="stat.galleries">Galleries</div>
      </div>
      <div class="hstat" id="hImagesStat" data-tip="">
        <div class="hstat-val" id="hTotalImages">—</div>
        <div class="hstat-label" data-i18n="stat.images">Images</div>
      </div>
      <div class="hstat" id="hSizeStat" data-tip="" data-tip-shift="">
        <div class="hstat-val" id="hTotalSize">—</div>
        <div class="hstat-label" data-i18n="stat.stored">Stored</div>
      </div>
    </div>
    <!-- Import stays in the bar at every width; when the nav minimizes it drops its label and
         keeps just the icon (handled in CSS), so it is never hidden behind the burger. -->
    <button class="btn-upload" id="uploadCbzBtn" data-tip="Import" data-i18n-tip="nav.import"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-upload-icon"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg><span class="btn-upload-label" data-i18n="nav.import">Import</span></button>
    <button class="btn-safe" id="safeBtn" data-tip="Enable Safe Mode&#10;(blur content for sharing)" data-i18n-tip="nav.safe_on"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="btn-settings" id="settingsBtn" data-tip="Settings" data-i18n-tip="nav.settings"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</header>

<div class="toolbar">
  <select class="sort-select" id="sortSelect" data-fit-widest>
    <option value="id" data-i18n="sort.id">Most Recent</option>
    <option value="updated" data-i18n="sort.updated">Last Updated</option>
    <option value="size" data-i18n="sort.size">Largest</option>
    <option value="count" data-i18n="sort.count">Most Pages</option>
    <option value="uploadDate" data-i18n="sort.uploadDate">Published Date</option>
  </select>
  <button class="filter-btn" id="filterBtn" type="button" aria-haspopup="dialog" data-tip="Filter" data-i18n-tip="filter.btn" aria-label="Filter" data-i18n-aria="filter.btn"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"/></svg></button>
</div>
<input type="file" id="cbzFileInput" accept=".cbz,.zip,.pdf,.jpg,.jpeg,.png,.webp,.gif,.avif,.shi,.shioridb" multiple style="display:none">
<input type="file" id="replaceImgInput" accept=".cbz,.zip,.pdf,.jpg,.jpeg,.png,.webp,.gif,.avif" multiple style="display:none">


<div class="grid" id="grid"></div>

<div id="pagination"></div>

<!-- Library filter modal (opened by the toolbar's filter button). Each option cycles
     any → show only → hide; the choice is kept across visits. -->
<div id="filterModal" class="modal-overlay">
  <div class="modal-box filter-box" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
    <div class="modal-title" id="filterTitle" data-i18n="filter.title">Filter library</div>
    <div class="filter-hint" data-i18n="filter.hint">Click an option to show only it, click again to hide it, and once more to reset.</div>
    <div class="filter-legend" aria-hidden="true">
      <span class="fopt-legend" data-state="include"><span class="fopt-mark"></span><span data-i18n="filter.include">Show only</span></span>
      <span class="fopt-legend" data-state="exclude"><span class="fopt-mark"></span><span data-i18n="filter.exclude">Hide</span></span>
    </div>
    <div class="filter-section">
      <div class="modal-label" data-i18n="filter.rating">Rating</div>
      <div class="filter-options" id="filterRating"></div>
    </div>
    <div class="filter-section">
      <div class="modal-label" data-i18n="filter.category">Category</div>
      <div class="filter-options" id="filterCategory"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="filterClear" type="button" data-i18n="filter.clear">Clear</button>
      <button class="btn primary" id="filterClose" type="button" data-i18n="common.close">Close</button>
    </div>
  </div>
</div>

<script type="module" src="js/library.js"></script>
</body>
</html>
