  <title>Shiori</title>
  <style>html,body{margin:0;height:100%;background:#111;color:#888;font:14px system-ui,sans-serif;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<script>
  // A static host serves this file (with a 404 status) for the app's clean addresses (/reader?…,
  // /settings) — they aren't real files. A hard reload bypasses the service worker, so we reload once
  // it's ready: that reload IS served by the worker (as the page that answers the address), with the
  // address bar left clean. With no worker yet (a first visit) this doesn't wait on an install: it
  // keeps the address and goes to the app's one page (index.html), which either draws what the
  // address asks for or goes on to the file that does (src/entry.ts); the app registers the worker
  // that suits where its library is kept.
  // The retry flag (cleared by the app once it boots) lets this run on every hard reload, while
  // bailing to the one page if the worker can't take over. Truly unknown paths say so.
  (async () => {
    const RETRY = 'shiori-sw-retry';
    // The app's addresses: the names app/js/pages.js has (this page cannot import it).
    const KNOWN = ['library', 'settings', 'reader', 'overview', 'tasks', 'components', 'library-next'];
    const parts = location.pathname.replace(/\/+$/, '').split('/');
    const seg = (parts.pop() || '').replace(/\.html$/, '');
    if (!KNOWN.includes(seg)) { document.body.textContent = 'Not found.'; return; }
    // This page is served AT the missing deep-link URL, which can sit at any depth (/library,
    // or /app/library after a clean-URL refresh without a worker) — so relative paths would
    // nest wrongly. Resolve the one page against the computed site root.
    let root = parts.join('/') + '/';
    if (root.endsWith('/app/')) root = root.slice(0, -4);
    if ('serviceWorker' in navigator && !sessionStorage.getItem(RETRY)) {
      sessionStorage.setItem(RETRY, '1');
      try {
        const existing = await navigator.serviceWorker.getRegistration();
        if (existing && existing.active) {
          // Bounded: a worker stuck activating never reaches "ready", and an unbounded await
          // would strand this page instead of falling through to the one page below.
          await Promise.race([
            navigator.serviceWorker.ready,
            new Promise((_, reject) => setTimeout(() => reject(new Error('sw timeout')), 8000)),
          ]);
          location.reload();
          return;
        }
      } catch {}
    }
    // Worker unavailable → the one page, by its file name (an address every host and every worker
    // answers with it), which takes the kept address from here.
    sessionStorage.setItem('shiori-route', seg + location.search + location.hash);
    location.replace(root + 'index.html');
  })();
</script>
<noscript>Not found.</noscript>
</body>
</html>
