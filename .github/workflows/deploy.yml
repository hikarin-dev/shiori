# Builds the site and publishes it to GitHub Pages on every push to main.
# (The repository's Pages source must be "GitHub Actions".)
name: Deploy

on:
  push:
    branches: [main]

# Nothing but reading the repository, unless a job says more.
permissions:
  contents: read

# One deployment at a time; a newer push waits for the one under way instead of cutting it off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
