<!DOCTYPE html>
<!-- titlebar.html — the strip across the top of a Shiori window: back and forward on the left, the
     page's title in the middle; Windows draws its own minimize, maximize and close over the right
     end. The strip is what the window is dragged by. -->
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <style>
    :root { --bg: #0d0d0f; --text: #f4f4f5; --muted: #a1a1aa; --dim: #52525c; --hover: #1c1c21; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body {
      display: flex; align-items: center; gap: 2px; padding: 0 150px 0 6px;
      font: 12px/1 "Segoe UI", system-ui, sans-serif; color: var(--muted);
      -webkit-app-region: drag; user-select: none;
    }
    button {
      -webkit-app-region: no-drag;
      width: 30px; height: 24px; display: grid; place-items: center; padding: 0;
      background: transparent; border: 0; border-radius: 6px; color: var(--muted); cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
    button:disabled { color: var(--dim); cursor: default; }
    button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #title { flex: 1; min-width: 0; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-left: 64px; }
  </style>
</head>
<body>
  <button id="back" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="forward" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
  <div id="title"></div>
  <script src="titlebar.js"></script>
</body>
</html>
